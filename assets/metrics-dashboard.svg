<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C47FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="cg">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="160" fill="#0d1117" rx="0"/>

  <!-- Card 1: Focus Areas -->
  <rect x="10" y="10" width="210" height="140" rx="10" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1"/>
  <text x="115" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B949E" letter-spacing="2">CORE FOCUS</text>
  <line x1="40" y1="52" x2="190" y2="52" stroke="#6C47FF" stroke-width="0.5" opacity="0.3"/>
  <text x="30" y="76" font-family="monospace" font-size="11" fill="#00F7FF">▸</text>
  <text x="45" y="76" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">LLM Frameworks</text>
  <text x="30" y="98" font-family="monospace" font-size="11" fill="#6C47FF">▸</text>
  <text x="45" y="98" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">RAG Pipelines</text>
  <text x="30" y="120" font-family="monospace" font-size="11" fill="#FFD700">▸</text>
  <text x="45" y="120" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">Agentic AI</text>
  <text x="30" y="142" font-family="monospace" font-size="11" fill="#00F7FF">▸</text>
  <text x="45" y="142" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">Multi-Agent Systems</text>

  <!-- Card 2: Current Status -->
  <rect x="235" y="10" width="210" height="140" rx="10" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B949E" letter-spacing="2">STATUS</text>
  <line x1="265" y1="52" x2="415" y2="52" stroke="#6C47FF" stroke-width="0.5" opacity="0.3"/>

  <circle cx="265" cy="76" r="4" fill="#28C840" opacity="0.9">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="278" y="80" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">Open to Collaborate</text>

  <circle cx="265" cy="100" r="4" fill="#00F7FF" opacity="0.8"/>
  <text x="278" y="104" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">Building AI Systems</text>

  <circle cx="265" cy="124" r="4" fill="#6C47FF" opacity="0.8"/>
  <text x="278" y="128" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E6EDF3">Mentoring @ BBC</text>

  <!-- Card 3: Quick Metrics -->
  <rect x="460" y="10" width="210" height="140" rx="10" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1"/>
  <text x="565" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B949E" letter-spacing="2">HIGHLIGHTS</text>
  <line x1="490" y1="52" x2="640" y2="52" stroke="#6C47FF" stroke-width="0.5" opacity="0.3"/>

  <text x="565" y="80" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#00F7FF" filter="url(#cg)">AI</text>
  <text x="565" y="100" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8B949E">First Builder</text>

  <line x1="490" y1="110" x2="640" y2="110" stroke="#6C47FF" stroke-width="0.5" opacity="0.2"/>
  <text x="565" y="132" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#FFD700">🇮🇳 India</text>
  <text x="565" y="148" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B949E">B.Tech AI &amp; DS</text>

  <!-- Card 4: Expertise Level -->
  <rect x="685" y="10" width="205" height="140" rx="10" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1"/>
  <text x="787" y="42" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B949E" letter-spacing="2">EXPERTISE</text>
  <line x1="715" y1="52" x2="860" y2="52" stroke="#6C47FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Progress bar: AI/ML -->
  <text x="705" y="74" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E6EDF3">AI / ML</text>
  <rect x="705" y="80" width="165" height="4" rx="2" fill="#21262d"/>
  <rect x="705" y="80" width="150" height="4" rx="2" fill="#00F7FF" opacity="0.8">
    <animate attributeName="width" values="0;150" dur="2s" fill="freeze"/>
  </rect>

  <!-- Progress bar: Web Dev -->
  <text x="705" y="102" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E6EDF3">Full Stack</text>
  <rect x="705" y="108" width="165" height="4" rx="2" fill="#21262d"/>
  <rect x="705" y="108" width="130" height="4" rx="2" fill="#6C47FF" opacity="0.8">
    <animate attributeName="width" values="0;130" dur="2.2s" fill="freeze"/>
  </rect>

  <!-- Progress bar: DevOps -->
  <text x="705" y="130" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E6EDF3">Cloud / DevOps</text>
  <rect x="705" y="136" width="165" height="4" rx="2" fill="#21262d"/>
  <rect x="705" y="136" width="110" height="4" rx="2" fill="#FFD700" opacity="0.8">
    <animate attributeName="width" values="0;110" dur="2.4s" fill="freeze"/>
  </rect>
</svg>
