<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C47FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6C47FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6C47FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#6C47FF"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C47FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6C47FF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6C47FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C47FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6C47FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Animated Grid Lines (subtle) -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="300" stroke="#00F7FF" stroke-width="0.5"/>
  </g>

  <!-- Neural Network Connections (left side) -->
  <g opacity="0.15">
    <!-- Layer 1 to Layer 2 -->
    <line x1="80" y1="60" x2="180" y2="100" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="60" x2="180" y2="160" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="150" x2="180" y2="100" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="150" x2="180" y2="160" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="150" x2="180" y2="220" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="240" x2="180" y2="160" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="240" x2="180" y2="220" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3.8s" repeatCount="indefinite"/>
    </line>

    <!-- Layer 2 to Layer 3 -->
    <line x1="180" y1="100" x2="280" y2="130" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.3s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="160" x2="280" y2="130" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.9s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="220" x2="280" y2="130" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.6s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="100" x2="280" y2="190" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4.1s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="160" x2="280" y2="190" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.4s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="220" x2="280" y2="190" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Neural Network Connections (right side) -->
  <g opacity="0.15">
    <line x1="920" y1="80" x2="1020" y2="120" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.1s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="80" x2="1020" y2="180" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.7s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="170" x2="1020" y2="120" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.3s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="170" x2="1020" y2="180" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="250" x2="1020" y2="180" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.9s" repeatCount="indefinite"/>
    </line>
    <line x1="1020" y1="120" x2="1120" y2="150" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1020" y1="180" x2="1120" y2="150" stroke="#6C47FF" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Neural Network Nodes (left) -->
  <g>
    <!-- Layer 1 -->
    <circle cx="80" cy="60" r="12" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="80" cy="60" r="4" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="150" r="12" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="80" cy="150" r="4" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="240" r="12" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="80" cy="240" r="4" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 2 -->
    <circle cx="180" cy="100" r="10" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="180" cy="100" r="3.5" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="160" r="10" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="180" cy="160" r="3.5" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="10" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="180" cy="220" r="3.5" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 3 -->
    <circle cx="280" cy="130" r="10" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="280" cy="130" r="3.5" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="190" r="10" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="280" cy="190" r="3.5" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Neural Network Nodes (right) -->
  <g>
    <circle cx="920" cy="80" r="12" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="920" cy="80" r="4" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="170" r="12" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="920" cy="170" r="4" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="250" r="10" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="920" cy="250" r="3.5" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="120" r="10" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="1020" cy="120" r="3.5" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="180" r="10" fill="url(#node-glow)" filter="url(#blur-sm)"/>
    <circle cx="1020" cy="180" r="3.5" fill="#00F7FF" opacity="0.8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="150" r="12" fill="url(#node-glow-purple)" filter="url(#blur-sm)"/>
    <circle cx="1120" cy="150" r="4" fill="#6C47FF" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Particles -->
  <g>
    <circle cx="350" cy="40" r="1.5" fill="#00F7FF" opacity="0.5">
      <animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="260" r="1" fill="#6C47FF" opacity="0.4">
      <animate attributeName="cy" values="260;245;260" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="50" r="1.5" fill="#FFD700" opacity="0.3">
      <animate attributeName="cy" values="50;38;50" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="270" r="1" fill="#00F7FF" opacity="0.4">
      <animate attributeName="cy" values="270;255;270" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="35" r="1.5" fill="#6C47FF" opacity="0.3">
      <animate attributeName="cy" values="35;25;35" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="265" r="1" fill="#FFD700" opacity="0.4">
      <animate attributeName="cy" values="265;250;265" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="275" r="1.2" fill="#00F7FF" opacity="0.35">
      <animate attributeName="cy" values="275;260;275" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="30" r="1.2" fill="#6C47FF" opacity="0.35">
      <animate attributeName="cy" values="30;20;30" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center Glow Effect -->
  <ellipse cx="600" cy="130" rx="250" ry="80" fill="#6C47FF" opacity="0.04" filter="url(#blur-lg)"/>
  <ellipse cx="600" cy="130" rx="150" ry="50" fill="#00F7FF" opacity="0.03" filter="url(#blur-lg)"/>

  <!-- Main Title -->
  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="8" fill="url(#text-gradient)" filter="url(#text-glow)">
    SOWMIYAN S
  </text>

  <!-- Subtitle -->
  <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#8B949E" opacity="0.9">
    AI &amp; LLM SYSTEMS ENGINEER  •  MULTI-AGENT ARCHITECT
  </text>

  <!-- Decorative Line Under Title -->
  <line x1="370" y1="175" x2="830" y2="175" stroke="url(#line-glow)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#00F7FF" opacity="0.6" letter-spacing="3">
    FOUNDER @ BOUND BY CODE  •  BUILDING THE FUTURE WITH AI
  </text>

  <!-- Hexagonal Accents -->
  <g opacity="0.08">
    <polygon points="370,80 380,74 390,80 390,92 380,98 370,92" stroke="#00F7FF" fill="none" stroke-width="0.8">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="820,210 830,204 840,210 840,222 830,228 820,222" stroke="#6C47FF" fill="none" stroke-width="0.8">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="340,220 350,214 360,220 360,232 350,238 340,232" stroke="#00F7FF" fill="none" stroke-width="0.8">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="850,60 860,54 870,60 870,72 860,78 850,72" stroke="#6C47FF" fill="none" stroke-width="0.8">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="5.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bottom Edge Glow -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#glow-cyan)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Edge Glow -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#glow-purple)" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
